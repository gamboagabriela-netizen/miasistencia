{% extends 'core/base.html' %}
{% block title %}Editar Estudiante{% endblock %}
{% block page_title %}Editar Estudiante{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h5 style="margin: 0;"><i class="bi bi-pencil"></i> Editar {{ estudiante.apellido }} {{ estudiante.nombre }}</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Código</label>
                        <input type="text" class="form-control" name="codigo" value="{{ estudiante.codigo }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellidos</label>
                        <input type="text" class="form-control" name="apellido" value="{{ estudiante.apellido }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombres</label>
                        <input type="text" class="form-control" name="nombre" value="{{ estudiante.nombre }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Curso</label>
                        <select class="form-control" name="curso" required>
                            {% for curso in cursos %}
                                <option value="{{ curso.id }}" {% if curso.id == estudiante.curso.id %}selected{% endif %}>Grado {{ curso.grado }} - Curso {{ curso.curso }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-warning w-100"><i class="bi bi-check-circle"></i> Actualizar</button>
                </form>
            </div>
        </div>
    </div>
</div>
<a href="{% url 'estudiantes' %}" class="btn btn-secondary mt-3"><i class="bi bi-arrow-left"></i> Cancelar</a>
{% endblock %}
