{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - MiAsistencia</title>
    <link rel="icon" type="image/png" href="{% static 'core/img/favicon.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --verde: #2E6F40;
            --verde-oscuro: #06402B;
            --degradado: linear-gradient(135deg, var(--verde) 0%, var(--verde-oscuro) 100%);
        }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh; padding: 20px;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at top left, var(--verde) 0%, var(--verde-oscuro) 55%, #032a1c 100%);
        }
        .inicio-container {
            background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
            padding: 60px 40px; max-width: 520px; width: 100%; text-align: center;
        }
        .inicio-container .logo-svg { width: 110px; height: 110px; margin: 0 auto 24px; filter: drop-shadow(0 8px 16px rgba(6,64,43,0.3)); }
        .inicio-container h1 { font-size: 2.6rem; font-weight: 300; color: var(--verde-oscuro); margin-bottom: 8px; }
        .inicio-container h1 strong { font-weight: 700; color: var(--verde); }
        .inicio-container .lema { color: #777; font-size: 1.05rem; margin-bottom: 36px; }
        .btn-inicio {
            display: inline-block; background: var(--degradado); border-radius: 10px;
            padding: 14px 44px; font-weight: 600; font-size: 1.05rem; color: white; text-decoration: none;
            transition: all 0.3s;
        }
        .btn-inicio:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(6, 64, 43, 0.4); color: white; }
        .btn-inicio i { margin-right: 6px; }
    </style>
</head>
<body>
    <div class="inicio-container">
        {% include 'core/_logo.html' %}
        <h1>Mi<strong>Asistencia</strong></h1>
        <p class="lema">Control de asistencia escolar</p>

        <a href="{% url 'login' %}" class="btn-inicio"><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión</a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
