{% extends 'core/base.html' %}
{% block title %}Agregar Estudiante{% endblock %}
{% block page_title %}Agregar Nuevo Estudiante{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 style="margin: 0;"><i class="bi bi-plus-circle"></i> Nuevo Estudiante</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Código</label>
                        <input type="text" class="form-control" name="codigo" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Apellidos</label>
                        <input type="text" class="form-control" name="apellido" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombres</label>
                        <input type="text" class="form-control" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Curso</label>
                        <select class="form-control" name="curso" required>
                            <option value="">Seleccionar curso</option>
                            {% for curso in cursos %}
                                <option value="{{ curso.id }}">Grado {{ curso.grado }} - Curso {{ curso.curso }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100"><i class="bi bi-check-circle"></i> Guardar</button>
                </form>
            </div>
        </div>
    </div>
</div>
<a href="{% url 'estudiantes' %}" class="btn btn-secondary mt-3"><i class="bi bi-arrow-left"></i> Cancelar</a>
{% endblock %}
